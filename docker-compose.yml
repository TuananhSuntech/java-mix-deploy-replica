services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${REGISTRY:-anh2019}/${DOCKER_IMAGE:-java-mix-deploy-replica}:${IMAGE_TAG:-latest}
    container_name: app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-staging}
    depends_on:
      - postgres

volumes:
  postgres_data: